[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nitro_agent"
version = "0.1.0"
description = "AI-powered AWS Nitro Enclave deployer"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click==8.1.7",
    "rich==13.7.1",
    "langchain>=0.1.13",
    "langchain-core>=0.1.33",
    "langchain-openai>=0.1.1",
    "langchain-anthropic>=1.3.4",
    "langchain-google-genai>=4.2.1",
    "python-dotenv==1.0.1",
    "pyflakes==3.0.0",
    "boto3==1.34.0",
    "cbor2==5.6.0",
    "cryptography==42.0.0",
    "requests==2.31.0"
]

[project.optional-dependencies]
dev = [
    "pytest==8.0.0",
    "pytest-mock==3.12.0",
]

[project.scripts]
nitro-agent = "nitro_agent.cli.main:main"
