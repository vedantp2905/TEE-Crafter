# nginx-alb — local stand-in for the AWS ALB that fronts Splunk in prod.
#
# Two listeners, same upstream:
#   :8443 (HTTPS, self-signed dev cert)  — Tier-1 localhost smoke test
#   :8080 (HTTP, no TLS)                 — Tier-2 ngrok upstream
#                                          (ngrok terminates real HTTPS at
#                                          its edge and forwards plain
#                                          HTTP here, exactly like an ALB
#                                          with ACM would do in prod)
#
# In both tiers, exactly one TLS hop happens at the front of the chain
# and the backend is plain HTTP — mirroring the production
# "ALB+ACM -> ECS task running splunk on :8088 HTTP" topology.

events { worker_connections 1024; }

http {
    upstream splunk_hec {
        server splunk:8088;
        keepalive 32;
    }

    # Globally applied proxy directives.
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_read_timeout 60s;
    # Continuous-attestation events are ~5 KB each; HEC supports batched
    # POSTs up to ~1 MB by default.  Bump generously for headroom.
    client_max_body_size 16M;

    # ---------------------------------------------------------------------
    # HTTPS listener — Tier 1 (localhost smoke test) and any direct
    # HTTPS-aware client.  Cert is self-signed; clients must set
    # `"extra": {"verify_ssl": "0"}` in their --siem-config JSON.
    # ---------------------------------------------------------------------
    server {
        listen 8443 ssl;
        http2  on;
        server_name _;

        ssl_certificate     /certs/cert.pem;
        ssl_certificate_key /certs/key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        location = /healthz {
            return 200 'ok\n';
            add_header Content-Type text/plain;
        }
        location / {
            proxy_pass http://splunk_hec;
            proxy_set_header X-Forwarded-Proto https;
        }
    }

    # ---------------------------------------------------------------------
    # HTTP listener — Tier 2 (ngrok upstream).  ngrok terminates real
    # Let's-Encrypt TLS at its edge and forwards plain HTTP here, so
    # nginx sees HTTP from ngrok but the *client* still sees HTTPS end
    # to end.  Exactly the same shape as ALB+ACM -> HTTP -> ECS task.
    # ---------------------------------------------------------------------
    server {
        listen 8080;
        server_name _;

        location = /healthz {
            return 200 'ok\n';
            add_header Content-Type text/plain;
        }
        location / {
            proxy_pass http://splunk_hec;
            # ngrok adds X-Forwarded-Proto=https itself; preserve it so
            # downstream logs see the original wire protocol.
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }
    }
}
