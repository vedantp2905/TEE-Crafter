# ngrok Agent v3 — bind the local API/UI on all interfaces so Docker can map
# :4040. The `ngrok` CLI no longer accepts `--web-addr` (removed in v3); use
# `agent.web_addr`. Without this the agent binds 127.0.0.1:4040 *inside* the
# container, so the published port refuses connections and
# `scripts/make_remote_splunk_siem_config.py` — which reads
# http://localhost:4040/api/tunnels — times out after 60s.
# The syslog/ sandbox already did this; splunk/ had been left behind.
version: 3
agent:
  web_addr: 0.0.0.0:4040
