@version: 4.8
@include "scl.conf"

# syslog-ng config for the TEE-Crafter SIEM sandbox.
#
# Listens on two transports, both with `flags(syslog-protocol)` so we
# strictly parse the RFC 5424 framing that `SyslogCefExporter` emits
# (PRI / VERSION=1 / TIMESTAMP / HOSTNAME / APP-NAME / PROCID / MSGID /
# STRUCTURED-DATA / MSG).  Anything not RFC-5424-compliant is dropped on
# the floor — which is precisely what production syslog collectors do,
# and what we want the smoke test to fail on if we regress the wire
# format.

options {
    chain_hostnames(off);
    keep_hostname(yes);
    use_dns(no);
    use_fqdn(no);
    # Don't reformat timestamps — preserve the ISO-8601 ones the
    # exporter emits so the file we tail still shows the exporter's
    # view of time, not syslog-ng's.
    keep_timestamp(yes);
    stats(level(1));
};

source s_udp_514 {
    network(
        transport("udp")
        ip("0.0.0.0")
        port(514)
        flags(syslog-protocol)
    );
};

source s_tcp_601 {
    network(
        transport("tcp")
        ip("0.0.0.0")
        port(601)
        flags(syslog-protocol)
        log-iw-size(10000)
    );
};

# One canonical line per event, formatted to make the smoke test's
# regexes obvious:
#   <ISO-TS> | <transport> | <hostname> | <app> | <full CEF message>
#
# ${MSG} is the CEF payload SyslogCefExporter put on the wire; the
# rest of the fields come from RFC 5424 framing.  We tag the transport
# in the line so the smoke test can prove UDP-vs-TCP independently.
destination d_file_udp {
    file("/var/log/tee-crafter/teelog.log"
         template("${ISODATE} | udp | ${HOST} | ${PROGRAM} | ${MSG}\n")
         create-dirs(yes)
         perm(0644)
         persist-name("teelog_udp_writer")
    );
};

destination d_file_tcp {
    file("/var/log/tee-crafter/teelog.log"
         template("${ISODATE} | tcp | ${HOST} | ${PROGRAM} | ${MSG}\n")
         create-dirs(yes)
         perm(0644)
         persist-name("teelog_tcp_writer")
    );
};

# Mirror everything to stderr so `docker compose logs syslog-ng` shows
# inbound traffic in real time during interactive debugging.
destination d_stderr_udp {
    file("/dev/stderr"
         template("${ISODATE} | udp | ${HOST} | ${PROGRAM} | ${MSG}\n")
         persist-name("stderr_udp_writer")
    );
};

destination d_stderr_tcp {
    file("/dev/stderr"
         template("${ISODATE} | tcp | ${HOST} | ${PROGRAM} | ${MSG}\n")
         persist-name("stderr_tcp_writer")
    );
};

log { source(s_udp_514); destination(d_file_udp); destination(d_stderr_udp); };
log { source(s_tcp_601); destination(d_file_tcp); destination(d_stderr_tcp); };
